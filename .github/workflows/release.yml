name: release

# Push a tag vX.Y.Z (or vX.Y.Z-beta.N for a pre-release): tests run, then the GitHub release is created.
# Home Assistant (Marketplace / HACS) offers the new version as an update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Version in manifest.json matches the tag
        run: test "v$(jq -r .version custom_components/ems/manifest.json)" = "$GITHUB_REF_NAME"
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - run: uv run --group ha pytest tests/ha -o addopts=""
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --title "$GITHUB_REF_NAME")
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"
