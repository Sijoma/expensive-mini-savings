[project]
name = "expensive-mini-savings"
version = "0.1.0"
description = "Home battery planner (dynamic tariff, PV forecast) as a Home Assistant integration"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.0",  # already shipped with Home Assistant
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.120",
  "ruff>=0.8",
]
ha = [
    "pytest-homeassistant-custom-component>=0.13.236",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["custom_components", "."]
testpaths = ["tests"]
asyncio_mode = "auto"  # only for tests/ha (pytest-asyncio from the ha group)
# The HA tests (tests/ha) need the HA test package and run separately:
#   uv run --group ha pytest tests/ha -o addopts=""
addopts = "-ra -p no:homeassistant -p no:socket --ignore=tests/ha"
filterwarnings = ["ignore:Unknown config option. asyncio_mode"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # German umlauts, dashes and × in user-facing texts are intended

[tool.ruff.lint.isort]
known-first-party = ["ems", "conftest"]
